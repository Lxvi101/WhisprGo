name: Bug report
description: Report reproducible WhisprGo behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove transcripts, API keys, and other private information before submitting.
  - type: input
    id: version
    attributes:
      label: WhisprGo version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M4, macOS 26.0
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Transcription model
      options:
        - Parakeet TDT 0.6B v3
        - Whisper local model
        - OpenAI model
        - Not model-related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs or screenshots are useful if they contain no private audio, transcripts, or credentials.
