name: Feature request
description: Suggest a focused improvement to WhisprGo.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest change that would solve it.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Performance and privacy impact
      description: Note any expected latency, memory, microphone, network, or storage tradeoffs.
